apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: deployflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployflow-postgres
  namespace: deployflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployflow-postgres
  template:
    metadata:
      labels:
        app: deployflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: deployflow-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - deployflow_user
                - -d
                - deployflow
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - deployflow_user
                - -d
                - deployflow
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: deployflow-postgres
  namespace: deployflow
spec:
  selector:
    app: deployflow-postgres
  ports:
    - port: 5432
      targetPort: 5432