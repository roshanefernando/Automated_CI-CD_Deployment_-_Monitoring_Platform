apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployflow-api
  namespace: deployflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployflow-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: deployflow-api
    spec:
      containers:
        - name: api
          image: ghcr.io/roshanefernando/deployflow-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: deployflow-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: deployflow-api
  namespace: deployflow
spec:
  type: NodePort
  selector:
    app: deployflow-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080