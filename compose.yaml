services:
  api:
    build:
      context: .
    container_name: deployflow-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "DeployFlow Task API"
      APP_VERSION: "0.1.0"
      DATABASE_URL: "postgresql+psycopg://deployflow_user:change_me_for_local_dev@db:5432/deployflow"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: deployflow-db
    environment:
      POSTGRES_DB: deployflow
      POSTGRES_USER: deployflow_user
      POSTGRES_PASSWORD: change_me_for_local_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployflow_user -d deployflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data: